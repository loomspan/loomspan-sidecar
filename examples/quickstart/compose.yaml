services:
  host:
    build: ./host
    network_mode: "service:sidecar"
    depends_on:
      sidecar:
        condition: service_started
    environment:
      QUICKSTART_ISSUER: loomspan-app
      QUICKSTART_AUDIENCE: loomspan-sidecar
      QUICKSTART_KEY_DIRECTORY: /keys
    volumes:
      - sidecar-keys:/keys
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 2s
      timeout: 1s
      retries: 15

  ingress:
    image: caddy:2.10.2
    network_mode: "service:sidecar"
    depends_on:
      sidecar:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  sidecar:
    image: ${SIDECAR_IMAGE:-loomspan-sidecar:sc5-local}
    user: "10001:10001"
    environment:
      SERVER_ADDRESS: 127.0.0.1
      LOOMSPAN_SIDECAR_TRUST_MODE: colocated
      LOOMSPAN_SIDECAR_TRUST_COLOCATED_KEY_DIRECTORY: /sidecar/keys
      LOOMSPAN_SIDECAR_EXECUTIONS_DIAGNOSTICS: ALWAYS
      LOOMSPAN_SIDECAR_CREDENTIAL_KEY: ${LOOMSPAN_SIDECAR_CREDENTIAL_KEY:-}
      LOOMSPAN_SIDECAR_SETUP_TOKEN: ${LOOMSPAN_SIDECAR_SETUP_TOKEN:-}
      LOOMSPAN_SIDECAR_MAIL_FROM: ${LOOMSPAN_SIDECAR_MAIL_FROM:-}
      LOOMSPAN_SIDECAR_EXTERNAL_BASE_URL: ${LOOMSPAN_SIDECAR_EXTERNAL_BASE_URL:-}
      LOOMSPAN_SIDECAR_SMTP_HOST: ${LOOMSPAN_SIDECAR_SMTP_HOST:-}
      LOOMSPAN_SIDECAR_SMTP_PORT: ${LOOMSPAN_SIDECAR_SMTP_PORT:-587}
      LOOMSPAN_SIDECAR_SMTP_USERNAME: ${LOOMSPAN_SIDECAR_SMTP_USERNAME:-}
      LOOMSPAN_SIDECAR_SMTP_PASSWORD: ${LOOMSPAN_SIDECAR_SMTP_PASSWORD:-}
      LOOMSPAN_SIDECAR_SMTP_AUTH: ${LOOMSPAN_SIDECAR_SMTP_AUTH:-false}
      LOOMSPAN_SIDECAR_SMTP_STARTTLS: ${LOOMSPAN_SIDECAR_SMTP_STARTTLS:-true}
      LOOMSPAN_SIDECAR_SECURE_COOKIE: ${LOOMSPAN_SIDECAR_SECURE_COOKIE:-false}
      LOOMSPAN_SHUTDOWN_TIMEOUT: 10s
    volumes:
      - sidecar-keys:/sidecar/keys:ro
      - sidecar-data:/sidecar/data
    ports:
      - "127.0.0.1:${SIDECAR_API_PORT:-8080}:18080"
      - "127.0.0.1:${QUICKSTART_HOST_PORT:-8081}:18081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 10s

volumes:
  sidecar-data:
  sidecar-keys:
    external: true
    name: ${SIDECAR_KEYS_VOLUME:-loomspan-quickstart-keys}
