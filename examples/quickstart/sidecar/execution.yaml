loomspan:
  connections:
    local:
      driver: openai
      base-url: http://127.0.0.1:8081/v1
      api-key: quickstart-fixture
  models:
    localplanner:
      connection: local
      provider-model: deterministic-planner
  executor-config:
    default:
      http:
        targets:
          identity-host:
            base-url: http://127.0.0.1:8081
            auth: {mode: caller-passthrough}
            connect-timeout: 2s
            read-timeout: 10s
            max-response-size: 16KB
          detail-host:
            base-url: http://127.0.0.1:8081
            auth: {mode: caller-passthrough}
            connect-timeout: 2s
            read-timeout: 10s
            max-response-size: 16KB
