targets:
  identity-host:
    base-url: ${QUICKSTART_HOST_URL:http://host:8081}
    auth: {mode: caller-passthrough}
    connect-timeout: 2s
    read-timeout: 10s
    max-response-size: 16KB
  detail-host:
    base-url: ${QUICKSTART_HOST_URL:http://host:8081}
    auth: {mode: caller-passthrough}
    connect-timeout: 2s
    read-timeout: 10s
    max-response-size: 16KB
routes:
  identityLeaf: {target: identity-host, method: POST, path: /callbacks/identity}
  detailLeaf: {target: detail-host, method: POST, path: /callbacks/detail}
