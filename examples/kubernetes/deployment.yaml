apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-with-loomspan-sidecar
spec:
  replicas: 1
  selector:
    matchLabels: {app: example-with-loomspan-sidecar}
  template:
    metadata:
      labels: {app: example-with-loomspan-sidecar}
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 10001
      containers:
        - name: application
          image: example/application:replace-me
          ports:
            - {name: callbacks, containerPort: 8081}
        - name: loomspan-sidecar
          image: ghcr.io/loomspan/loomspan-sidecar:replace-me
          ports:
            - {name: api, containerPort: 8080}
            - {name: management, containerPort: 9091}
          env:
            - name: LOOMSPAN_CONNECTIONS_APPLICATION_DRIVER
              value: openai
            - name: LOOMSPAN_CONNECTIONS_APPLICATION_BASE_URL
              value: https://model.example/v1
            - name: LOOMSPAN_CONNECTIONS_APPLICATION_API_KEY
              valueFrom: {secretKeyRef: {name: loomspan-sidecar-secrets, key: model-api-key}}
            - name: LOOMSPAN_MODELS_APPLICATIONMODEL_CONNECTION
              value: application
            - name: LOOMSPAN_MODELS_APPLICATIONMODEL_PROVIDER_MODEL
              value: replace-me
            - name: LOOMSPAN_SIDECAR_AUTH_JWT_ISSUER_URI
              valueFrom: {secretKeyRef: {name: loomspan-sidecar-secrets, key: issuer-uri}}
            - name: LOOMSPAN_SIDECAR_AUTH_JWT_AUDIENCE
              valueFrom: {secretKeyRef: {name: loomspan-sidecar-secrets, key: audience}}
            - name: LOOMSPAN_SIDECAR_AUTH_JWT_PUBLIC_KEY_LOCATION
              value: file:/sidecar/keys/public.pem
            - name: LOOMSPAN_SIDECAR_SETUP_TOKEN
              valueFrom: {secretKeyRef: {name: loomspan-sidecar-secrets, key: setup-token}}
            - name: LOOMSPAN_SIDECAR_MAIL_FROM
              value: sidecar@example.invalid
            - name: LOOMSPAN_SIDECAR_EXTERNAL_BASE_URL
              value: https://console.example.invalid
            - name: LOOMSPAN_SIDECAR_SMTP_HOST
              value: smtp.example.invalid
            - name: LOOMSPAN_SIDECAR_SMTP_PORT
              value: "587"
            - name: LOOMSPAN_SIDECAR_SMTP_AUTH
              value: "true"
            - name: LOOMSPAN_SIDECAR_SMTP_STARTTLS
              value: "true"
            - name: LOOMSPAN_SIDECAR_SMTP_USERNAME
              valueFrom: {secretKeyRef: {name: loomspan-sidecar-secrets, key: smtp-username}}
            - name: LOOMSPAN_SIDECAR_SMTP_PASSWORD
              valueFrom: {secretKeyRef: {name: loomspan-sidecar-secrets, key: smtp-password}}
            - name: LOOMSPAN_SHUTDOWN_TIMEOUT
              value: 30s
          volumeMounts:
            - {name: jwt-key, mountPath: /sidecar/keys, readOnly: true}
            - {name: sidecar-data, mountPath: /sidecar/data}
          startupProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 10
      volumes:
        - name: jwt-key
          secret:
            secretName: loomspan-sidecar-jwt-key
            items: [{key: public.pem, path: public.pem}]
        - name: sidecar-data
          persistentVolumeClaim:
            claimName: loomspan-sidecar-data
