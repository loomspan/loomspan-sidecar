targets:
  app:
    base-url: https://app:8443
    ssl-bundle: app
    auth:
      mode: caller-passthrough
    connect-timeout: 2s
    read-timeout: 3s
    max-response-size: 4KB
# Add application-specific routes and approve their passthrough recipients.
routes:
  owned:
    target: app
    method: POST
    path: /loomspan/callbacks/owned
