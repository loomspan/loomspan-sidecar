[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "loomspan-sdk"
version = "0.1.0.dev0"
description = "Python client for discovering and executing Loomspan Sidecar skills"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "anyio>=4.16,<5",
    "asn1>=3.3,<4",
    "cryptography>=48,<49",
    "h11>=0.16,<0.17",
    "pyasn1>=0.6.5,<0.7",
    "pyasn1-modules>=0.4.2,<0.5",
    "simplejson>=4.2,<5",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.162.2,<0.163", "starlette>=1.10,<1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/loomspan_sdk"]
