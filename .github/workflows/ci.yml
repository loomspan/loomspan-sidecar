name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Also inherited by Maven launched from the production browser verifier.
      MAVEN_ARGS: -Dloomspan.version=1.0.0-beta.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify portable Sidecar guidance and client
        run: |
          python -m unittest discover -s scripts -p 'test_agent_skills.py' -v
          python -m unittest discover -s agent-skills/loomspan-sidecar-authoring/client -p 'test_*.py' -v
      - name: Install Chromium for browser integration checks
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test-compile org.codehaus.mojo:exec-maven-plugin:3.6.2:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test -Dexec.args="install --with-deps chromium"
      - name: Verify against published Loomspan beta 5
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - name: Build and verify image without publishing
        run: |
          python scripts/test_verify_shutdown.py
          docker build --tag loomspan-sidecar:ci .
          python scripts/verify-image.py --image loomspan-sidecar:ci
          python scripts/verify-production.py --image loomspan-sidecar:ci
