name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify against published Loomspan beta 5
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dloomspan.version=1.0.0-beta.5 verify
      - name: Build and verify image without publishing
        run: |
          docker build --tag loomspan-sidecar:ci .
          python scripts/verify-image.py --image loomspan-sidecar:ci --verify-kubernetes
