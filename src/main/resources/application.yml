loomspan:
  skills:
    locations:
      - "classpath:/sidecar-empty-skills/*.yaml"
  observability:
    enabled: false

loomspan-sidecar:
  storage:
    database-path: /sidecar/data/sidecar.db
  snapshots:
    max-retained: 10
  management:
    session-idle-timeout: 30m
    edit-lease-timeout: 15m
    mail-from: ${LOOMSPAN_SIDECAR_MAIL_FROM:}
    external-base-url: ${LOOMSPAN_SIDECAR_EXTERNAL_BASE_URL:}
  url-variables: []
  auth:
    jwt:
      roles-claim: roles
      role-prefix: ROLE_
      clock-skew: 60s
  executions:
    max-input-size: 1MB
    max-retained: 1000
    completed-ttl: 15m
    max-concurrent: 32
    max-queued: 128
    max-queued-input-size: 64MB
    diagnostics: NEVER

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      # Multipart framing and small confirmation fields fit outside the ZIP bound.
      max-request-size: 101MB
      file-size-threshold: 0B
  mail:
    host: ${LOOMSPAN_SIDECAR_SMTP_HOST:}
    port: ${LOOMSPAN_SIDECAR_SMTP_PORT:587}
    username: ${LOOMSPAN_SIDECAR_SMTP_USERNAME:}
    password: ${LOOMSPAN_SIDECAR_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${LOOMSPAN_SIDECAR_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${LOOMSPAN_SIDECAR_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${LOOMSPAN_SIDECAR_SMTP_STARTTLS_REQUIRED:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  flyway:
    enabled: false

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${LOOMSPAN_SIDECAR_SECURE_COOKIE:true}

management:
  health:
    mail:
      enabled: false
  server:
    port: 9091
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
