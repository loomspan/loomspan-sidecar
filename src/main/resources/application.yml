loomspan:
  skills:
    locations:
      - "file:/sidecar/skills/**/*.yaml"
      - "file:/sidecar/skills/**/*.yml"
  observability:
    enabled: false

loomspan-sidecar:
  storage:
    database-path: /sidecar/data/sidecar.db
  rest-routes-location: "file:/sidecar/rest-routes.yaml"
  auth:
    jwt:
      roles-claim: roles
      role-prefix: ROLE_
      clock-skew: 60s
  executions:
    max-input-size: 1MB
    max-retained: 1000
    completed-ttl: 15m
    max-concurrent: 32
    max-queued: 128
    max-queued-input-size: 64MB
    diagnostics: NEVER

spring:
  flyway:
    enabled: false

management:
  server:
    port: 9091
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
